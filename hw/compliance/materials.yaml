# lifecycle: active | nrnd | eol | obsolete | unknown, with 'source' and 'checked' (date).
# EN IEC 63000 accepts supplier declarations as technical documentation; it asks for a risk-based
# assessment of the supplier (verify against the standard text). Only 'declared' counts as evidence.
