- id: USB-C-RECEPTACLE.mounting
  parameter: Mounting type of the USB4085
  category: mechanical
  statement: 'Dip type, PCB top mount (through-hole). The drawing shows no edge-mount variant; the ordering grid has only contact plating and packing options.'
  notes: The project footprint has the same pad pattern as the drawing (0.85 mm pitch, 1.35 mm row offset, shell tails 8.65 mm apart against 8.64 mm) and puts the connector at the PCB edge. The overhang and fit are a mechanical question and are not checked here.
  source: {document: gct-usb4085-dwg, page: 1, locator: Title block, quote: 'Dip Type, PCB Top Mount'}
