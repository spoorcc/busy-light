claims:
- id: USB-C-RECEPTACLE.contacts_usb2
  parameter: Contacts of a USB 2.0 Type-C receptacle
  category: mechanical
  statement: 'A USB 2.0 Type-C receptacle has 16 contacts: A1, A4 to A9, A12, B1, B4 to B9 and B12 (matches the 16 pins of J1 in the netlist; the shell pin SH is separate).'
  notes: From the USB-IF compliance document (a standard, not a vendor datasheet for the chosen part).
  source: {page: 28, locator: Section 4.10.1.1.1, quote: '16 contacts: A1, A4, A5, A6, A7, A8, A9, A12, B1, B4, B5, B6, B7, B8, B9, and B12.'}
- id: USB-C-RECEPTACLE.llcr_initial
  parameter: Low level contact resistance, initial
  category: electrical
  max: 40
  unit: mohm
  notes: Compliance requirement for the mated connector from the USB-IF document; a part datasheet value is still needed. The quote ends mid-sentence by the one-row limit.
  source: {page: 14, locator: Table 3-1, quote: '40 mΩ (max) initial for VBUS, GND and all'}
- id: USB-C-RECEPTACLE.pin_names
  parameter: Pin names and functions (A1 GND ... B12 GND)
  category: function
  status: source-missing
  notes: The USB Type-C Cable and Connector Specification (the document that names the pins) is not in the datasheets folder, and the vendor datasheet of the chosen receptacle is missing. The contact numbers are known only from the compliance
    document (claim contacts_usb2).
- id: USB-C-RECEPTACLE.vbus_current_rating
  parameter: VBUS contacts current rating, all VBUS pins together
  category: electrical
  max: 5
  unit: A
  notes: 'The drawing also gives 6.25 A for the GND pins together, 1.25 A for A5/B5 and 0.25 A per pin for all other pins. The HW-010 top step is about 1.5 A.'
  source: {document: gct-usb4085-dwg, page: 1, locator: Specifications Electrical, quote: 'Current Rating: 5.00A collectively for VBUS pins'}
