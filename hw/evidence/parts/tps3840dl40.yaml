- id: TPS3840DL40.t_d_eq3
  parameter: Reset time delay, equation 3 (typical)
  category: timing
  unit: second
  formula:
    expression: -ln(0.29)*R*C+t0
    variables:
      R: ohm
      C: farad
      t0: second
    unit: second
  notes: R is RCT, C is CCT_EXT, t0 is tD(no cap).
  source: {page: 18, locator: Equation 3, quote: tD = − ln 0.29 × RCT × CCT_EXT + tD no cap}
- id: TPS3840DL40.t_d_eq4
  parameter: Reset time delay, equation 4 (typical, with RCT = 500 kohm)
  category: timing
  unit: second
  formula:
    expression: 618937*C+50e-6
    variables:
      C: farad
    unit: second
  source: {page: 18, locator: Equation 4, quote: tD = 618937 × CCT_EXT + 50μs}
- id: TPS3840DL40.t_d_min_eq6
  parameter: Reset time delay minimum, equation 6
  category: timing
  unit: second
  formula:
    expression: -ln(0.36)*R*C+t0
    variables:
      R: ohm
      C: farad
      t0: second
    unit: second
  notes: R is RCT min (350 kohm), C is the minimum capacitor value including its tolerance, t0 is tD(no cap) min. The datasheet table gives no tD(no cap) minimum, so t0 must be taken as 0 or measured; this is an open point.
  source: {page: 18, locator: Equation 6, quote: 'tD minimum = − ln 0.36 × RCT min × CCT min + tD no cap, min'}
- id: TPS3840DL40.t_d_max_eq7
  parameter: Reset time delay maximum, equation 7
  category: timing
  unit: second
  formula:
    expression: -ln(0.26)*R*C+t0
    variables:
      R: ohm
      C: farad
      t0: second
    unit: second
  notes: R is RCT max (650 kohm), C is the maximum capacitor value including its tolerance, t0 is tD(no cap) max (50 us).
  source: {page: 18, locator: Equation 7, quote: 'tD maximum = − ln 0.26 × RCT max × CCT max + tD no cap, max'}
- id: TPS3840DL40.rec_cct_max
  parameter: Largest recommended delay capacitor
  category: recommended
  max: 10
  unit: uF
  source: {page: 18, locator: Section 7.3.2, quote: The reset time delay (tD) can be programmed by connecting a capacitor no larger than 10µF between CT pin and GND.}
