name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python3 -I scripts/check_traceability.py
      - run: python3 -I scripts/check_docs_style.py
      - name: Install diagram tools
        run: |
          sudo apt-get update && sudo apt-get install -y plantuml
          npm ci --prefix scripts/diagrams
      - run: scripts/build_diagrams.sh --check
  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install --group hw --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy scripts
      - run: pytest
  hardware:
    runs-on: ubuntu-24.04
    container: kicad/kicad:10.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/ci_hw.sh
        env: {HW_CI_OUT: hw-reports}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: hw-reports, path: hw-reports, if-no-files-found: ignore}
  mechanical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install FreeCAD
        run: sudo apt-get update && sudo apt-get install -y freecad
      - run: scripts/ci_mech.sh
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: scripts/ci_sw.sh
