name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python3 -I scripts/check_traceability.py
      - run: python3 -I scripts/check_docs_style.py
      - name: Install diagram tools
        run: |
          # Ubuntu's plantuml package is an older version and draws differently. Use the exact
          # version that the committed SVGs were made with, checked against the publisher's SHA-256.
          sudo apt-get update && sudo apt-get install -y default-jre-headless
          curl -fsSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar
          echo "5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462  plantuml.jar" | sha256sum -c -
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec java -Djava.awt.headless=true -jar "%s/plantuml.jar" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/bin/plantuml"
          chmod +x "$HOME/bin/plantuml"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          npm ci --prefix scripts/diagrams
      - run: scripts/build_diagrams.sh --check
  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install --group hw --group dev
      - run: reuse lint
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy scripts
      - run: pytest
  hardware:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/ci_hw.sh
        env: {HW_CI_OUT: hw-reports}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: hw-reports, path: hw-reports, if-no-files-found: ignore}
  mechanical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install FreeCAD
        # Ubuntu 24.04 has no freecad package. The sha256 comes from the same release page,
        # so it detects a corrupt download but not a compromised release (ADR-0012 item 4, open).
        run: |
          curl -fsSL -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          echo "f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s/FreeCAD.AppImage" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/bin/freecad"
          chmod +x "$HOME/bin/freecad"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: scripts/ci_mech.sh
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Host compiler for native_sim
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib device-tree-compiler ninja-build cmake
      - run: scripts/ci_sw.sh
        env: {ZEPHYR_TOOLCHAIN_VARIANT: host}
